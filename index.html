<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZUTOMAYO Discography Graph</title>
    <meta
      name="description"
      content="ZUTOMAYO discography interactive graph built from singles, studio records, and Blu-ray/live sessions."
    />
    <link rel="icon" type="image/x-icon" href="./asset/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <div class="crt" aria-hidden="true"></div>
    <div class="orb orb-a" aria-hidden="true"></div>
    <div class="orb orb-b" aria-hidden="true"></div>

    <main class="layout">
      <section class="graph-panel">
        <div class="panel-bar">
          <div class="top-card">
            <img class="panel-logo" src="./asset/logo.svg" alt="ZUTOMAYO Discography Map" />
            <div class="panel-actions" aria-label="Graph shortcuts">
              <div class="filter-menu">
                <button type="button" class="filter-trigger">Filter</button>
                <div class="filter-popover" role="group" aria-label="Discography filters">
                  <label class="filter-option">
                    <input type="checkbox" data-filter-kind="single" checked />
                    <span>Single</span>
                  </label>
                  <label class="filter-option">
                    <input type="checkbox" data-filter-kind="mini" checked />
                    <span>Mini</span>
                  </label>
                  <label class="filter-option">
                    <input type="checkbox" data-filter-kind="full" checked />
                    <span>Full</span>
                  </label>
                  <label class="filter-option">
                    <input type="checkbox" data-filter-kind="tour" />
                    <span>Blu-ray / Live</span>
                  </label>
                </div>
              </div>
            </div>
            <p class="card-hover-tip" aria-hidden="true">
              Blu-ray / Live is off by default for smoother browsing. Hidden lanes are removed and the remaining layout expands automatically.
            </p>
          </div>
        </div>

        <div class="graph-stage">
          <svg id="graph" aria-label="ZUTOMAYO discography graph"></svg>
          <div id="tooltip" class="tooltip" hidden></div>
        </div>
      </section>
    </main>

    <footer class="info-footer">
      <div class="detail-card focus-bar" id="detailCard">
        <button id="closeFocusDrawerButton" class="focus-close" type="button" aria-label="Close Focus">
          Close
        </button>
        <h2 id="detailTitle">ZUTOMAYO Discography Graph</h2>
        <p id="detailSubtitle" class="detail-subtitle">
          노드나 앨범 트랙을 클릭하면 관련 경로가 강조됩니다.
        </p>
        <div id="detailArtwork" class="detail-artwork detail-artwork-empty"></div>
        <dl class="detail-list" id="detailList"></dl>
        <div class="detail-links" id="detailLinks"></div>
      </div>
      <p class="site-note">이 페이지는 팬심 목적이며 아무런 상업적 목적이 없습니다.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
    <script src="./site-config.js"></script>
    <script src="./analytics.js"></script>
    <script src="./data/discography.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
